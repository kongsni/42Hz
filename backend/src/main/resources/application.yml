spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fortytwohz}
    username: ${DB_USER:fortytwohz}
    password: ${DB_PASSWORD:local_dev_only}
  flyway:
    enabled: false # Enable only in an explicitly selected local/test migration workflow
    baseline-on-migrate: false
    clean-disabled: true
    validate-on-migrate: true
    locations: classpath:db/migration
  sql:
    init:
      mode: never
  jpa:
    hibernate:
      ddl-auto: validate # Flyway owns DDL; existing databases must be checked before deployment
    open-in-view: false
server:
  port: 8080
